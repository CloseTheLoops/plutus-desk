[project]
name = "plutus"
version = "0.1.0"
description = "Market-making analysis desk for tokens you issue. Analysis layer only — holds no private key."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "requests>=2.32",
]

[project.scripts]
plutus = "plutus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plutus"]
