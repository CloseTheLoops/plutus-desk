<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plutus — the float, wallet by wallet</title>
<style>
  :root{--bg:#0e1116;--card:#171c24;--ink:#e6e9ee;--dim:#8b95a5;--line:#242b36;
        --good:#4cc38a;--bad:#e5534b;--warn:#d4a72c;--acc:#539bf5;--ours:#7a5cd6}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,Segoe UI,sans-serif;padding:22px 16px 60px}
  main{max-width:1280px;margin:0 auto}
  h1{font-size:21px;margin-bottom:2px}
  .sub{color:var(--dim);font-size:12.5px;margin-bottom:14px}
  a{color:var(--acc)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin:12px 0}
  .card h3{font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;font-weight:600}
  table{border-collapse:collapse;width:100%;font-size:12.5px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--dim);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;
     position:sticky;top:0;background:var(--card);cursor:pointer;user-select:none;z-index:2}
  th:hover{color:var(--ink)}
  th.s::after{content:" ▾";color:var(--acc)}
  th.s.asc::after{content:" ▴"}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tbody tr:hover td{background:#1d2530}
  tr.act td{box-shadow:inset 3px 0 0 var(--warn)}
  .good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.dim{color:var(--dim)}.acc{color:var(--acc)}
  code{font-family:ui-monospace,Consolas,monospace;font-size:11.5px}
  .hdr{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-end;margin-bottom:6px}
  .hdr div{min-width:90px}
  .hdr b{display:block;font-size:18px;font-variant-numeric:tabular-nums;line-height:1.2}
  .hdr span{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
  .ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  select,input{background:#0a0d12;color:var(--ink);border:1px solid var(--line);
    border-radius:6px;padding:6px 9px;font-size:12.5px;font-family:inherit}
  input.search{min-width:210px}
  .seg{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:700}
  .s-never{background:#4cc38a;color:#0e1116}
  .s-deep{background:#e5534b;color:#fff}
  .s-mild{background:#d4a72c;color:#0e1116}
  .s-profit{background:#539bf5;color:#0e1116}
  .tag{font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:3px;padding:0 4px;margin-right:3px}
  .wrap{max-height:70vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
  .note{font-size:12px;color:var(--dim);margin-top:8px}
  .note.w{color:var(--warn)}
  .bar2{height:4px;background:#0a0d12;border-radius:2px;overflow:hidden;min-width:44px}
  .bar2 i{display:block;height:100%;background:var(--acc)}

  .pull{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .pull button{background:#0a0d12;border:1px solid var(--line);color:var(--ink);
    border-radius:6px;padding:6px 13px;font-size:12.5px;cursor:pointer;font-family:inherit}
  .pull button:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
  .pull button:disabled{opacity:.45;cursor:not-allowed}
  .pull .st{font-size:11.5px;color:var(--dim)}
  .spin{display:inline-block;width:11px;height:11px;border:2px solid var(--line);
    border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-1px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .copy{cursor:pointer;border-bottom:1px dotted var(--line)}
  .copy:hover{color:var(--acc);border-bottom-color:var(--acc)}
  .copied{color:var(--good)!important;border-bottom-color:transparent!important}
</style>
</head>
<body>
<main>
<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
  <h1>The float, wallet by wallet</h1>
  <a href="/?token_id={{ token_id }}" style="font-size:12.5px;text-decoration:none;
     border:1px solid var(--line);border-radius:6px;padding:5px 11px">← analysis</a>
  <div class="pull" style="margin-left:auto">
    <button id="pullQ" onclick="pull(false)" title="pool reserves + trade tape · ~2s">↻ pull</button>
    <button id="pullF" onclick="pull(true)" title="also every wallet balance + the holder census · ~2min">↻↻ full pull</button>
    <span class="st" id="pullSt"></span>
  </div>
</div>
<div class="sub" id="sub">loading…</div>

<div class="card">
  <div class="hdr" id="hdr"></div>
  <div class="note" id="notes"></div>
</div>

<div class="card">
  <div class="ctl">
    <select id="seg">
      <option value="">all segments</option>
      <option value="never bought">never bought</option>
      <option value="deep underwater">deep underwater</option>
      <option value="mild underwater">mild underwater</option>
      <option value="in profit">in profit</option>
    </select>
    <select id="act">
      <option value="">any activity</option>
      <option value="1">traded in the last 24h</option>
      <option value="0">dormant in the window</option>
    </select>
    <select id="tag"><option value="">any tag</option></select>
    <input class="search" id="q" placeholder="search address…">
    <label style="font-size:12px;color:var(--dim)">
      <input type="checkbox" id="target" style="vertical-align:-2px"> show what a
      <input type="number" id="tgt" value="60" step="1" style="width:56px;padding:3px 5px"> % target needs
    </label>
    <span class="dim" id="count" style="margin-left:auto;font-size:12px"></span>
  </div>
  <div class="wrap"><table>
    <thead><tr>
      <th data-k="rank" class="num">#</th>
      <th data-k="address">wallet</th>
      <th data-k="tokens" class="num s">tokens</th>
      <th data-k="share_float" class="num">of float</th>
      <th data-k="share_supply" class="num">of supply</th>
      <th data-k="cumulative_share" class="num">cum.</th>
      <th data-k="usd" class="num">value</th>
      <th data-k="vs_cost" class="num">vs cost</th>
      <th data-k="segment">segment</th>
      <th data-k="held_days" class="num">held</th>
      <th data-k="dormant_days" class="num">last seen</th>
      <th data-k="net24" class="num">net 24h</th>
      <th data-k="tags">flags</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
  <div class="note" id="foot"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const num=n=>n==null?'—':Math.round(n).toLocaleString('en-US');
const usd=n=>n==null?'—':'$'+Math.round(n).toLocaleString('en-US');
const pct=(n,d=2)=>n==null?'—':(100*n).toFixed(d)+'%';
const ago=t=>{if(!t)return'never';const s=Math.floor(Date.now()/1000)-t;
  return s<90?s+'s':s<5400?Math.round(s/60)+'m':s<172800?Math.round(s/3600)+'h':Math.round(s/86400)+'d';};
let DATA=null, SORT={k:'tokens',asc:false};

function vsCost(h){
  if(h.vs_cost==null) return '<span class="dim">never bought</span>';
  const d=(h.vs_cost-1)*100;
  const cls=d>=0?'good':(h.vs_cost<0.5?'bad':'warn');
  return `<span class="${cls}">${d>=0?'+':''}${d.toFixed(0)}%</span>`;
}
function segTag(s){
  const m={'never bought':'s-never','deep underwater':'s-deep','mild underwater':'s-mild','in profit':'s-profit'};
  return `<span class="seg ${m[s]||''}">${s}</span>`;
}

function render(){
  if(!DATA) return;
  const d=DATA, t=d.target||{};
  $('sub').innerHTML=`${num(d.holders.length)} third-party wallets holding
    <b>${num(d.float_true)}</b> tokens — the float. Excludes your ${pct(d.ours_share,1)},
    the pool, staking and burnt supply. Swept ${ago(d.sweep_ts)} ago.`;
  $('hdr').innerHTML=[
    ['wallets',num(d.holders.length),''],
    ['float',num(d.float_true),''],
    ['float value',usd(d.float_true*d.spot),''],
    ['traded 24h',num(d.active_24h),d.active_24h?'warn':'dim'],
    ['fully exited',num(d.exited),'dim'],
    ['census coverage',pct(d.coverage,1),d.coverage<0.99?'warn':'good'],
  ].map(([k,v,c])=>`<div><b class="${c}">${v}</b><span>${k}</span></div>`).join('');
  $('notes').innerHTML=(d.notes||[]).map(n=>`<div class="note w">! ${n}</div>`).join('');

  const tags=new Set(); d.holders.forEach(h=>(h.tags||[]).forEach(x=>tags.add(x)));
  if($('tag').options.length<=1)
    [...tags].sort().forEach(x=>$('tag').add(new Option(x,x)));

  let rows=d.holders.slice();
  const seg=$('seg').value, act=$('act').value, tg=$('tag').value, q=$('q').value.trim().toLowerCase();
  if(seg) rows=rows.filter(h=>h.segment===seg);
  if(act==='1') rows=rows.filter(h=>h.fills_24h>0);
  if(act==='0') rows=rows.filter(h=>!h.fills_24h);
  if(tg) rows=rows.filter(h=>(h.tags||[]).includes(tg));
  if(q) rows=rows.filter(h=>h.address.toLowerCase().includes(q));

  rows.forEach(h=>h.net24=(h.bought_24h||0)-(h.sold_24h||0));
  const k=SORT.k;
  if(k!=='rank') rows.sort((a,b)=>{
    const x=a[k],y=b[k];
    if(x==null&&y==null)return 0; if(x==null)return 1; if(y==null)return -1;
    const c=typeof x==='string'?x.localeCompare(y):x-y;
    return SORT.asc?c:-c;
  });

  const need=$('target').checked?(t.need_tokens||0):0;
  let run=0, cutoff=-1;
  if(need) rows.forEach((h,i)=>{run+=h.tokens; if(cutoff<0&&run>=need) cutoff=i;});

  $('rows').innerHTML=rows.map((h,i)=>{
    const hit=need&&cutoff>=0&&i<=cutoff;
    return `<tr class="${h.fills_24h?'act':''}" ${hit?'style="background:#141f18"':''}>
      <td class="num dim">${i+1}</td>
      <td><code class="copy" data-full="${h.address}" title="click to copy the full address"
        >${h.address.slice(0,10)}…${h.address.slice(-6)}</code></td>
      <td class="num">${num(h.tokens)}</td>
      <td class="num"><b>${pct(h.share_float,2)}</b></td>
      <td class="num dim">${pct(h.share_supply,3)}</td>
      <td class="num dim">${pct(h.cumulative_share,1)}</td>
      <td class="num">${usd(h.usd)}</td>
      <td class="num">${vsCost(h)}</td>
      <td>${segTag(h.segment)}</td>
      <td class="num dim">${h.held_days==null?'—':h.held_days.toFixed(0)+'d'}</td>
      <td class="num ${h.dormant_days!=null&&h.dormant_days<1?'warn':'dim'}">${
        h.last_active_ts?ago(h.last_active_ts):'—'}</td>
      <td class="num ${h.net24>0?'good':(h.net24<0?'bad':'dim')}">${
        h.fills_24h?((h.net24>0?'+':'')+usd(h.net24)):'—'}</td>
      <td>${(h.tags||[]).slice(0,3).map(x=>`<span class="tag">${x}</span>`).join('')}${
        h.suspicious?'<span class="tag bad">susp</span>':''}</td>
    </tr>`;}).join('');

  $('count').textContent=`${rows.length} of ${d.holders.length} shown`;
  $('foot').innerHTML = need
    ? (cutoff>=0
        ? `<span class="good">Highlighted: the top <b>${cutoff+1}</b> wallets hold
           <b>${num(run)}</b> tokens — enough to cover the <b>${num(need)}</b> a
           ${$('tgt').value}% target needs.</span> ${cutoff+1<=40?'That is a set of conversations,\n           not a market operation, and conversations have no price impact.':''}`
        : `<span class="warn">Even every wallet listed (${num(run)}) falls short of the
           ${num(need)} a ${$('tgt').value}% target needs — the rest would have to come from
           supply the census cannot see, or the target is out of reach.</span>`)
    : 'Rows with an amber edge traded in the last 24h. Click any column to sort.';
}

document.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{
  const k=th.dataset.k;
  SORT = SORT.k===k ? {k,asc:!SORT.asc} : {k,asc:false};
  document.querySelectorAll('th').forEach(x=>x.classList.remove('s','asc'));
  th.classList.add('s'); if(SORT.asc) th.classList.add('asc');
  render();
});
['seg','act','tag','q','target','tgt'].forEach(id=>{
  $(id).addEventListener('input',()=>{ if(id==='tgt'||id==='target') load(); else render(); });
});

async function load(){
  const t=$('target').checked?(+$('tgt').value||60)/100:0;
  const r=await fetch(`/api/holders?token_id={{ token_id }}&target=${t}`);
  DATA=await r.json(); render();
}

// ── click any address to copy it in full ─────────────────────────────────────
// The tables show a truncated address because a 42-character string wrecks a column, but the
// truncation is exactly what makes it useless for pasting into an explorer. Clicking copies the
// whole thing from data-full, so the display can stay short without costing anything.
function copyAddr(el){
  const a=el.dataset.full||el.textContent.trim();
  const done=()=>{const t=el.textContent; el.textContent='copied ✓'; el.classList.add('copied');
    setTimeout(()=>{el.textContent=t; el.classList.remove('copied');},900);};
  if(navigator.clipboard&&window.isSecureContext){ navigator.clipboard.writeText(a).then(done,()=>fb()); }
  else fb();
  function fb(){ // http://127.0.0.1 is a secure context in Chrome/Firefox, but not everywhere
    const ta=document.createElement('textarea'); ta.value=a;
    ta.style.cssText='position:fixed;opacity:0'; document.body.appendChild(ta);
    ta.select(); try{document.execCommand('copy');done();}catch(e){}
    document.body.removeChild(ta);
  }
}
document.addEventListener('click',e=>{
  const el=e.target.closest('.copy'); if(el) copyAddr(el);
});

// ── pull fresh data on demand ────────────────────────────────────────────────
async function pull(full){
  const q=$('pullQ'), f=$('pullF'), st=$('pullSt');
  q.disabled=f.disabled=true;
  st.innerHTML='<span class="spin"></span> ' + (full?'full pull — reserves, tape, every wallet balance, then the census':'pulling reserves and tape');
  try{
    const r=await (await fetch(`/api/refresh?token_id={{ token_id }}&full=${full?1:0}`,{method:'POST'})).json();
    if(r.error){ st.innerHTML='<span class="bad">'+r.error+'</span>'; }
    else if(r.running){ return poll(); }
    else { st.innerHTML=summarise(r.results); await reload(); }
  }catch(e){ st.innerHTML='<span class="bad">pull failed: '+e+'</span>'; }
  q.disabled=f.disabled=false;
}
function summarise(rs){
  if(!rs||!rs.length) return 'nothing returned';
  const bad=rs.filter(r=>!r.ok);
  return (bad.length?'<span class="warn">':'<span class="good">')
    + rs.map(r=>`${r.name} ${r.ok?'ok':'FAILED'}`).join(' · ')
    + `</span> <span class="dim">· ${rs.reduce((a,r)=>a+(r.calls||0),0)} calls, `
    + `${rs.reduce((a,r)=>a+(r.seconds||0),0).toFixed(1)}s</span>`;
}
async function poll(){
  const st=$('pullSt');
  const j=await (await fetch('/api/refresh?token_id={{ token_id }}')).json();
  if(j.running){
    st.innerHTML=`<span class="spin"></span> ${j.stage}… <span class="dim">`
      +`${j.results&&j.results.length?j.results.map(r=>r.name).join(' · ')+' done':''}</span>`;
    return setTimeout(poll,1500);
  }
  st.innerHTML=(j.error?'<span class="bad">'+j.error+'</span> ':'')+summarise(j.results);
  $('pullQ').disabled=$('pullF').disabled=false;
  await reload();
}

const reload=load;
load(); setInterval(load,60000);
</script>
</main>
</body>
</html>
