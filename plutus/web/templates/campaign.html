<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plutus — campaign</title>
<style>
  :root{--bg:#0e1116;--card:#171c24;--ink:#e6e9ee;--dim:#8b95a5;--line:#242b36;
        --good:#4cc38a;--bad:#e5534b;--warn:#d4a72c;--acc:#539bf5;--ours:#7a5cd6}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,Segoe UI,sans-serif;padding:22px 16px 60px}
  main{max-width:1000px;margin:0 auto}
  h1{font-size:21px;margin-bottom:2px}
  .sub{color:var(--dim);font-size:12.5px;margin-bottom:14px}
  a{color:var(--acc)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 20px;margin:12px 0}
  .card h3{font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;font-weight:600}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.dim{color:var(--dim)}.acc{color:var(--acc)}
  .hdr{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-end}
  .hdr div{min-width:96px}
  .hdr b{display:block;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.2}
  .hdr span{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
  .track{height:26px;background:#0a0d12;border-radius:6px;overflow:hidden;position:relative;margin:12px 0 4px}
  .track i{display:block;height:100%;background:linear-gradient(90deg,#2b5f8f,#539bf5);transition:width .5s}
  .track u{position:absolute;top:0;bottom:0;width:2px;background:var(--warn);text-decoration:none}
  .track b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:11.5px;font-weight:700;color:#e6e9ee;text-shadow:0 1px 3px #000}
  .legend{display:flex;justify-content:space-between;font-size:11px;color:var(--dim)}
  .step{border-radius:9px;padding:15px 18px;margin:12px 0;font-size:15px;line-height:1.5}
  .A-BUY{background:#122a1e;border:1px solid var(--good)}
  .A-SELL{background:#2b2411;border:1px solid var(--warn)}
  .A-HOLD{background:#0a0d12;border:1px solid var(--line)}
  .A-STOP,.A-DONE{background:#2c1614;border:1px solid var(--bad)}
  .A-DONE{background:#122a1e;border-color:var(--good)}
  .step .act{font-size:22px;font-weight:700;letter-spacing:-.01em}
  .step .why{font-size:13px;color:var(--dim);margin-top:6px;line-height:1.55}
  .pill{display:inline-block;font-size:10px;padding:2px 9px;border-radius:20px;margin-left:9px;vertical-align:3px}
  .p-behind{background:var(--bad);color:#fff}
  .p-ahead{background:var(--good);color:#0e1116}
  .live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:6px;animation:p 2s infinite}
  @keyframes p{0%,100%{opacity:1}50%{opacity:.25}}
  button{background:#0a0d12;border:1px solid var(--line);color:var(--ink);border-radius:7px;
    padding:8px 16px;font-size:13px;cursor:pointer;font-family:inherit}
  button:hover{border-color:var(--acc);color:var(--acc)}
  button.stop:hover{border-color:var(--bad);color:var(--bad)}
  .note{font-size:12px;color:var(--dim);margin-top:8px}
  .note.w{color:var(--warn)}
  code{background:#0a0d12;padding:1px 5px;border-radius:4px;font-size:11.5px}
  .copy{cursor:pointer;border-bottom:1px dotted var(--line)}
  .copy:hover{color:var(--acc);border-bottom-color:var(--acc)}
  .split{display:flex;height:26px;border-radius:5px;overflow:hidden;margin:8px 0 6px;font-size:10.5px}
  .split div{flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    color:#0e1116;font-weight:700;min-width:0;overflow:hidden;white-space:nowrap}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--dim)}
  .legend span::before{content:"■ "}
  .ours{color:var(--ours)}
  tr.us td{box-shadow:inset 3px 0 0 var(--ours)}
  .fin{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .fin div{background:#0a0d12;border:1px solid var(--line);border-radius:8px;padding:11px 13px}
  .fin b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
  .fin span{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
</style>
</head>
<body>
<main>
<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
  <h1 id="title">Campaign</h1>
  <a href="/?token_id={{ token_id }}" style="font-size:12.5px;text-decoration:none;
     border:1px solid var(--line);border-radius:6px;padding:5px 11px">← analysis</a>
  <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
    <span class="dim" id="tick" style="font-size:11.5px"></span>
    <button class="stop" id="stop">Stop campaign</button>
  </div>
</div>
<div class="sub" id="sub">loading…</div>

<div class="card">
  <h3><span class="live"></span>progress</h3>
  <div class="hdr" id="hdr"></div>
  <div class="track" id="track"><i style="width:0%"></i><u style="left:0%"></u><b></b></div>
  <div class="legend"><span id="lgL"></span><span id="lgR"></span></div>
</div>

<div id="stepBox"></div>

<div class="card">
  <h3>what you have actually done</h3>
  <table id="done"></table>
  <div class="note" id="doneNote"></div>
</div>

<div class="card">
  <h3>live market</h3>
  <table id="mkt"></table>
  <div class="note" id="notes"></div>
</div>

<div class="card">
  <h3><span class="live"></span>who is trading — us vs everyone else</h3>
  <div class="split" id="split"></div>
  <div class="legend" id="splitLg"></div>
  <table id="tot"></table>
  <div class="note" id="splitNote"></div>
</div>

<div class="card">
  <h3>active wallets since this campaign started</h3>
  <table id="acts"></table>
  <div class="note" id="actsNote"></div>
</div>

<div class="card" id="finalCard" style="display:none">
  <h3>final stats</h3>
  <div id="final"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const usd=n=>n==null?'—':'$'+Math.round(n).toLocaleString('en-US');
const num=n=>n==null?'—':Math.round(n).toLocaleString('en-US');
const pct=(n,d=1)=>n==null?'—':(100*n).toFixed(d)+'%';
const mins=s=>s==null?'—':(s<0?'expired':(s<3600?Math.round(s/60)+'m':(s/3600).toFixed(1)+'h'));

const TITLES={push:'Push the price',acquire:'Acquire supply',distribute:'Distribute into demand'};

function render(d){
  if(d.error){$('sub').innerHTML='<span class="bad">'+d.error+'</span>';return;}
  const p=d.params||{},b=d.baseline||{},n=d.now||{},s=d.step||{};
  $('title').textContent=TITLES[d.kind]||'Campaign';
  $('sub').innerHTML=`campaign #${d.id} · <b class="${d.state==='running'?'good':'dim'}">${d.state}</b>`
    +` · started ${mins(d.elapsed_s)} ago`
    +(d.deadline_ts?` · <b>${mins(d.remaining_s)} left</b> of the window`:'');

  let goal='', cur='';
  if(d.kind==='push'){ goal=usd(p.target_fdv); cur=usd(n.fdv); }
  if(d.kind==='acquire'){ goal=pct(p.target_share,2); cur=pct(n.ours_share,2); }
  if(d.kind==='distribute'){ goal=num(p.max_sell_tokens)+' tokens'; cur=num(d.done.sold_tok); }

  $('hdr').innerHTML=[
    ['now',cur,'acc'],['goal',goal,''],
    ['progress',pct(d.progress_pct),d.progress_pct>=1?'good':''],
    ['time used',d.time_pct==null?'—':pct(d.time_pct),''],
    ['spot',n.spot?n.spot.toExponential(4):'—','dim'],
    ['pool depth',usd(n.Q),'dim'],
  ].map(([k,v,c])=>`<div><b class="${c}">${v}</b><span>${k}</span></div>`).join('');

  const prog=Math.max(0,Math.min(1,d.progress_pct||0)), tm=d.time_pct==null?null:Math.max(0,Math.min(1,d.time_pct));
  $('track').querySelector('i').style.width=(100*prog)+'%';
  const u=$('track').querySelector('u');
  if(tm==null){u.style.display='none';} else {u.style.display='';u.style.left=(100*tm)+'%';}
  $('track').querySelector('b').textContent=pct(prog)+' of the way';
  $('lgL').textContent='start: '+(d.kind==='push'?usd(b.fdv):d.kind==='acquire'?pct(b.ours_share,2):'0 sold');
  $('lgR').innerHTML=tm==null?'no deadline'
    :`<span class="warn">▏</span> time marker — ahead of it means someone else is doing the work`;

  const act=s.action||'HOLD';
  const amt = act==='BUY'? usd(s.usd) : act==='SELL'? num(s.tokens)+' tokens ('+usd(s.usd)+')' : '';
  $('stepBox').innerHTML=`<div class="step A-${act}">
    <div class="act">${act}${amt?' '+amt:''}${
      s.urgency==='behind'?'<span class="pill p-behind">behind schedule</span>':
      s.urgency==='ahead'?'<span class="pill p-ahead">ahead — let it run</span>':''}</div>
    <div class="why">${s.reason||''}</div></div>`;

  $('done').innerHTML=`
    <tr><th></th><th class="num">usd</th><th class="num">tokens</th><th class="num">avg price</th></tr>
    <tr><td class="good">bought</td><td class="num">${usd(d.done.bought_usd)}</td>
      <td class="num">${num(d.done.bought_tok)}</td>
      <td class="num">${d.done.avg_buy?d.done.avg_buy.toExponential(3):'—'}</td></tr>
    <tr><td class="bad">sold</td><td class="num">${usd(d.done.sold_usd)}</td>
      <td class="num">${num(d.done.sold_tok)}</td>
      <td class="num">${d.done.avg_sell?d.done.avg_sell.toExponential(3):'—'}</td></tr>`;
  $('doneNote').innerHTML=d.done.fills
    ? `${d.done.fills} of our own fills since this campaign started — read from the tape, not
       from a counter, so a restart cannot lose track and double-spend.`
    : `No fills from us yet. <b>Nothing here executes</b> — this tells you what to do and you
       place it yourself.`;

  $('mkt').innerHTML=`
    <tr><td>third-party flow, last 15m</td><td class="num ${n.third_net_15m>0?'good':(n.third_net_15m<0?'bad':'dim')}">${
      (n.third_net_15m>0?'+':'')+usd(n.third_net_15m)}</td></tr>
    <tr><td>regime</td><td class="num">${(n.regime||'').replace('_',' ')}</td></tr>
    <tr><td>pool depth Q <span class="dim">— everything scales with this</span></td><td class="num">${usd(n.Q)}</td></tr>
    <tr><td>your holdings</td><td class="num">${num(n.ours)} <span class="dim">(${pct(n.ours_share,2)})</span></td></tr>
    ${n.peak_price?`<tr><td>peak price this run</td><td class="num">${n.peak_price.toExponential(4)}</td></tr>`:''}`;
  $('notes').innerHTML=(d.notes||[]).map(x=>`<div class="note w">! ${x}</div>`).join('');
  $('stop').style.display=d.state==='running'?'':'none';
  renderSplit(d);
}

function copyAddr(el){
  const a=el.dataset.full||el.textContent.trim();
  const done=()=>{const t=el.textContent;el.textContent='copied ✓';
    setTimeout(()=>{el.textContent=t;},900);};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(a).then(done,fb);}
  else fb();
  function fb(){const ta=document.createElement('textarea');ta.value=a;
    ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');done();}catch(e){}document.body.removeChild(ta);}
}
document.addEventListener('click',e=>{const el=e.target.closest('.copy');if(el)copyAddr(el);});

// A campaign is a contest over who is on which side of the move. The number that decides
// whether a push was worth running is not how far the chart went but how much of the volume was
// OUR OWN money — a move carried entirely by us unwinds the moment we stop.
function renderSplit(d){
  const P=d.participants||{}, o=P.ours||{}, t=P.third||{}, tot=P.total_volume||0;
  const fin=$('finalCard');
  if(!tot){
    $('split').innerHTML=''; $('splitLg').innerHTML='';
    $('tot').innerHTML='<tr><td class="dim">no trades yet since this campaign started</td></tr>';
    $('splitNote').textContent='';
    $('acts').innerHTML='<tr><td class="dim">nothing yet</td></tr>';
    $('actsNote').textContent='';
  } else {
    const ow=100*(o.volume||0)/tot, tw=100-ow;
    $('split').innerHTML=
      (ow>0?`<div style="flex-basis:${ow}%;background:#7a5cd6" title="us: ${usd(o.volume)}">${
        ow>14?'us '+ow.toFixed(0)+'%':(ow>5?ow.toFixed(0)+'%':'')}</div>`:'')
     +(tw>0?`<div style="flex-basis:${tw}%;background:#4cc38a" title="everyone else: ${usd(t.volume)}">${
        tw>14?'everyone else '+tw.toFixed(0)+'%':(tw>5?tw.toFixed(0)+'%':'')}</div>`:'');
    $('splitLg').innerHTML=`<span class="ours">us ${usd(o.volume)}</span>`
      +`<span class="good">everyone else ${usd(t.volume)}</span>`
      +`<span class="dim">${usd(tot)} total across ${P.active} wallets</span>`;
    $('tot').innerHTML=`
      <tr><th></th><th class="num">wallets</th><th class="num">fills</th>
          <th class="num">bought</th><th class="num">sold</th><th class="num">net</th></tr>
      <tr class="us"><td class="ours">us</td><td class="num">${o.wallets||0}</td>
        <td class="num">${o.fills||0}</td><td class="num">${usd(o.buy_usd)}</td>
        <td class="num">${usd(o.sell_usd)}</td>
        <td class="num ${o.net>0?'good':(o.net<0?'bad':'dim')}">${(o.net>0?'+':'')+usd(o.net)}</td></tr>
      <tr><td class="good">everyone else</td><td class="num">${t.wallets||0}</td>
        <td class="num">${t.fills||0}</td><td class="num">${usd(t.buy_usd)}</td>
        <td class="num">${usd(t.sell_usd)}</td>
        <td class="num ${t.net>0?'good':(t.net<0?'bad':'dim')}">${(t.net>0?'+':'')+usd(t.net)}</td></tr>`;
    const share=P.our_share_of_volume||0;
    $('splitNote').innerHTML = share>0.6
      ? `<span class="warn">! ${pct(share)} of this campaign's volume is your own money. A move
         carried mostly by you is not being paid for by anyone else, and it gives back what you
         put in when you stop.</span>`
      : `Your share of campaign volume is ${pct(share)}. The lower that stays while the goal
         still advances, the more of the move someone else is funding.`;
    const ws=P.wallets||[];
    $('acts').innerHTML=`<tr><th>wallet</th><th class="num">fills</th><th class="num">bought</th>
        <th class="num">sold</th><th class="num">net</th><th class="num">last seen</th></tr>`
     +ws.map(w=>`<tr class="${w.is_ours?'us':''}">
        <td>${w.is_ours?'<span class="ours">us · </span>':''}<code class="copy"
          data-full="${w.maker}" title="click to copy">${(w.maker||'').slice(0,10)}…${
          (w.maker||'').slice(-6)}</code></td>
        <td class="num">${w.fills}</td><td class="num">${usd(w.buy_usd)}</td>
        <td class="num">${usd(w.sell_usd)}</td>
        <td class="num ${w.net>0?'good':(w.net<0?'bad':'dim')}">${(w.net>0?'+':'')+usd(w.net)}</td>
        <td class="num dim">${mins(Math.floor(Date.now()/1000)-w.last_ts)} ago</td></tr>`).join('');
    $('actsNote').innerHTML=`${P.active} wallet${P.active===1?'':'s'} traded since this campaign
      started. Purple edge means ours. Click any address to copy it.`;
  }
  const over = d.state!=='running' || (d.step&&(d.step.action==='DONE'||d.step.action==='STOP'));
  fin.style.display = over ? '' : 'none';
  if(over) renderFinal(d);
}

function renderFinal(d){
  const P=d.participants||{},o=P.ours||{},t=P.third||{},b=d.baseline||{},n=d.now||{};
  const moved=(b.spot&&n.spot)?n.spot/b.spot:null;
  const netUsd=(o.sell_usd||0)-(o.buy_usd||0);
  const netTok=(o.buy_tok||0)-(o.sell_tok||0);
  const share=P.our_share_of_volume||0;
  $('final').innerHTML=`<div class="fin">
    <div><b class="${moved>1?'good':(moved<1?'bad':'')}">${moved?moved.toFixed(2)+'x':'—'}</b><span>price moved</span></div>
    <div><b>${usd(o.buy_usd)}</b><span>we spent</span></div>
    <div><b>${usd(o.sell_usd)}</b><span>we received</span></div>
    <div><b class="${netUsd>=0?'good':'bad'}">${(netUsd>=0?'+':'')+usd(netUsd)}</b><span>our net cash</span></div>
    <div><b class="${netTok>=0?'good':'bad'}">${(netTok>=0?'+':'')+num(netTok)}</b><span>our net tokens</span></div>
    <div><b>${usd(t.volume)}</b><span>everyone else traded</span></div>
    <div><b class="${share>0.6?'warn':'good'}">${pct(share)}</b><span>volume that was us</span></div>
    <div><b>${P.active||0}</b><span>wallets involved</span></div>
  </div><div class="note">${share>0.6
    ? '<span class="warn">Most of this move was your own money — a rally with nobody else in it, which reverts when you stop.</span>'
    : 'Outside participation carried '+pct(1-share)+' of the volume. That share is what makes a move durable.'}</div>`;
}

async function load(){
  try{
    const r=await fetch('/api/campaign/{{ cid }}');
    render(await r.json());
    $('tick').textContent='updated '+new Date().toLocaleTimeString();
  }catch(e){ $('tick').innerHTML='<span class="bad">update failed</span>'; }
}
$('stop').onclick=async()=>{
  await fetch('/api/campaign/{{ cid }}/stop',{method:'POST'});
  load();
};
load(); setInterval(load,20000);
</script>
</main>
</body>
</html>
